name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build -Recurse -Filter "Vega Productions Mixer.exe" |
            Where-Object { $_.FullName -like "*Release*" } |
            Select-Object -First 1 |
            Copy-Item -Destination dist
          Copy-Item README.md dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: VegaProductionsMixer-Windows
          path: dist
