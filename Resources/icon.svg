<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363636"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>

  <!-- VU-style scale around the knob: grey dots, cyan lit segment -->
  <g transform="translate(512 528)">
    <g fill="#8c8c8c">
      <circle r="13" transform="rotate(-135) translate(0 -372)"/>
      <circle r="13" transform="rotate(-108) translate(0 -372)"/>
      <circle r="13" transform="rotate(-81) translate(0 -372)"/>
      <circle r="13" transform="rotate(-54) translate(0 -372)"/>
      <circle r="13" transform="rotate(-27) translate(0 -372)"/>
      <circle r="13" transform="rotate(0) translate(0 -372)"/>
      <circle r="13" transform="rotate(27) translate(0 -372)"/>
      <circle r="13" transform="rotate(54) translate(0 -372)"/>
      <circle r="13" transform="rotate(81) translate(0 -372)"/>
      <circle r="13" transform="rotate(108) translate(0 -372)"/>
      <circle r="13" transform="rotate(135) translate(0 -372)"/>
    </g>
    <path d="M -263 263 A 372 372 0 1 1 263 -263" transform="rotate(0)" fill="none" stroke="#5fe3e0" stroke-width="30" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
    <!-- red overload tip -->
    <path d="M 316 -196 A 372 372 0 0 1 359 -97" fill="none" stroke="#ff5a5a" stroke-width="30" stroke-linecap="round"/>

    <!-- knob body -->
    <circle r="300" fill="url(#knob)" filter="url(#shadow)"/>
    <circle r="300" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

    <!-- circled V logo -->
    <circle r="205" fill="none" stroke="#eeeeee" stroke-width="30"/>
    <path d="M -112 -78 L 0 118 L 112 -78" fill="none" stroke="#eeeeee" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
